<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Falalu Schools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 900: '#0a1628', 950: '#060e1a' },
                        accent: { 500: '#2563eb', 600: '#1d4ed8' }
                    },
                    fontFamily: {
                        display: ['"Playfair Display"', 'serif'],
                        body: ['"Inter"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
        body { background: #060e1a; color: #ffffff; font-family: 'Inter', sans-serif; }
        .sidebar-link.active { background: linear-gradient(90deg, rgba(37,99,235,0.2) 0%, transparent 100%); border-left: 3px solid #2563eb; }
        @media (max-width: 1023px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay { display: none; }
            .sidebar-overlay.show { display: block; }
        }
        #status-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #000; color: #0f0; font-family: monospace; font-size: 12px; padding: 6px 10px; z-index: 999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body class="bg-brand-950 text-white font-body antialiased">

    <div id="status-bar">⏳ Ready</div>

    <!-- Sidebar overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay fixed inset-0 bg-black/50 z-20" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar w-64 bg-brand-900 border-r border-white/5 flex flex-col fixed h-full z-30 inset-y-0 left-0 lg:relative lg:translate-x-0">
        <div class="h-20 flex items-center px-6 border-b border-white/5">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-lg bg-accent-500 flex items-center justify-center text-white"><span class="material-symbols-outlined text-xl">school</span></div>
                <div><h1 class="font-display text-lg font-bold">Falalu</h1><p class="text-xs text-gray-400">Admin</p></div>
            </div>
        </div>
        <nav class="flex-1 py-6 px-3 space-y-1 overflow-y-auto">
            <a href="#" class="sidebar-link active flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300" data-module="dashboard"><span class="material-symbols-outlined text-xl">dashboard</span> Dashboard</a>
            <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300" data-module="students"><span class="material-symbols-outlined text-xl">people</span> Students</a>
            <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300" data-module="teachers"><span class="material-symbols-outlined text-xl">school</span> Teachers</a>
            <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300" data-module="classes"><span class="material-symbols-outlined text-xl">groups</span> Classes</a>
            <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300" data-module="attendance"><span class="material-symbols-outlined text-xl">checklist</span> Attendance</a>
            <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300" data-module="exams"><span class="material-symbols-outlined text-xl">quiz</span> Exams</a>
            <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300" data-module="fees"><span class="material-symbols-outlined text-xl">payments</span> Fees</a>
            <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300" data-module="notices"><span class="material-symbols-outlined text-xl">campaign</span> Notices</a>
        </nav>
        <div class="p-4 border-t border-white/5">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-accent-500/20 flex items-center justify-center text-accent-400 font-semibold text-sm" id="user-avatar">A</div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium truncate" id="user-name">Admin</p>
                    <button id="logout-btn" class="text-xs text-gray-400 hover:text-red-400 transition">Logout</button>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main content -->
    <div class="flex-1 flex flex-col min-h-screen lg:ml-64">
        <header class="sticky top-0 z-10 bg-brand-900/95 backdrop-blur-sm border-b border-white/5">
            <div class="flex items-center justify-between h-16 px-4">
                <div class="flex items-center gap-4">
                    <button id="menu-toggle" class="lg:hidden p-2 rounded-lg hover:bg-white/5 text-gray-400"><span class="material-symbols-outlined">menu</span></button>
                    <h1 class="font-display text-xl lg:text-2xl font-bold" id="module-title">Dashboard</h1>
                </div>
                <div class="flex items-center gap-3">
                    <div class="hidden sm:flex items-center gap-3 border-l border-white/5 pl-4">
                        <span class="text-sm font-medium hidden lg:inline" id="header-user">Admin User</span>
                    </div>
                </div>
            </div>
        </header>

        <main id="main-content" class="flex-1 p-4 lg:p-8 flex items-center justify-center">
            <div class="text-center">
                <div class="animate-spin h-10 w-10 border-2 border-accent-500 border-t-transparent rounded-full mx-auto"></div>
                <p class="mt-4 text-gray-400">Loading dashboard...</p>
            </div>
        </main>
    </div>

    <!-- No external Supabase SDK – we use our own fetch wrapper -->
    <script>
        const statusEl = document.getElementById('status-bar');
        function log(msg) {
            statusEl.textContent = msg;
            console.log(msg);
        }

        const SUPABASE_URL = 'https://hfdyznlnxfrrlqdziqpn.supabase.co';
        const ANON_KEY = 'sb_publishable_Dh5sg8xSYwsWtgttyCe2Zw_L_le2Yxk';
        let authToken = localStorage.getItem('supabase_token') || '';

        // Helper to make authenticated requests
        async function supabaseFetch(path, options = {}) {
            const url = `${SUPABASE_URL}/rest/v1/${path}`;
            const headers = {
                'Content-Type': 'application/json',
                'apikey': ANON_KEY,
                'Authorization': `Bearer ${authToken}`,
                ...options.headers
            };
            const res = await fetch(url, { ...options, headers });
            if (!res.ok) {
                const err = await res.json().catch(() => ({ message: res.statusText }));
                throw new Error(err.message || `Request failed with status ${res.status}`);
            }
            // For HEAD requests or 204, return null
            if (res.status === 204 || options.method === 'HEAD') return null;
            return res.json();
        }

        // Check authentication on page load
        async function checkAuth() {
            if (!authToken) {
                log('No token, redirecting to login...');
                window.location.href = 'login.html';
                return;
            }
            try {
                // Verify token by fetching user
                const { data: { user } } = await supabase.auth.getUser(); // fallback to SDK if available, but we use token
                // We'll just assume token is valid; if requests fail later, we redirect
                log('Authenticated');
                // Load user profile
                const profiles = await supabaseFetch('profiles?select=*&id=eq.' + getUserIdFromToken());
                const profile = profiles[0];
                const name = profile?.full_name || 'Admin';
                document.getElementById('user-name').textContent = name;
                document.getElementById('user-avatar').textContent = name.charAt(0).toUpperCase();
                document.getElementById('header-user').textContent = name;
                loadModule('dashboard');
            } catch (e) {
                log('Auth check failed: ' + e.message);
                localStorage.removeItem('supabase_token');
                window.location.href = 'login.html';
            }
        }

        // Simple JWT decode to get user ID (needed for profile query)
        function getUserIdFromToken() {
            try {
                const payload = JSON.parse(atob(authToken.split('.')[1]));
                return payload.sub;
            } catch (e) {
                return '';
            }
        }

        const mainContent = document.getElementById('main-content');
        const moduleTitle = document.getElementById('module-title');

        function showError(msg) {
            log('ERROR: ' + msg);
            mainContent.innerHTML = `<div class="text-center text-red-400 p-4"><p class="font-bold">${msg}</p></div>`;
        }

        async function loadModule(module) {
            log('Loading module: ' + module);
            const titles = {
                dashboard: 'Dashboard Overview',
                students: 'Student Management',
                teachers: 'Teacher Management',
                classes: 'Class Management',
                attendance: 'Attendance',
                exams: 'Examinations',
                fees: 'Fee Management',
                notices: 'Notice Board'
            };
            moduleTitle.textContent = titles[module] || module;
            mainContent.innerHTML = `<div class="flex items-center justify-center h-64 text-gray-400">Loading ${titles[module]}...</div>`;

            if (module === 'dashboard') {
                await renderDashboard();
            } else if (module === 'students') {
                await renderStudents();
            } else {
                mainContent.innerHTML = `<div class="flex items-center justify-center h-64 text-gray-400">${titles[module]} module coming soon.</div>`;
            }

            if (window.innerWidth < 1024) closeSidebar();
        }

        // --- Dashboard ---
        async function renderDashboard() {
            try {
                const [students, teachers, classes, notices] = await Promise.all([
                    supabaseFetch('students?select=id&limit=0', { method: 'HEAD' }).then(res => {
                        const count = res ? parseInt(res.headers.get('content-range')?.split('/')[1]) : 0;
                        return isNaN(count) ? 0 : count;
                    }).catch(() => 0),
                    supabaseFetch('teachers?select=id&limit=0', { method: 'HEAD' }).then(res => {
                        const count = res ? parseInt(res.headers.get('content-range')?.split('/')[1]) : 0;
                        return isNaN(count) ? 0 : count;
                    }).catch(() => 0),
                    supabaseFetch('classes?select=id&limit=0', { method: 'HEAD' }).then(res => {
                        const count = res ? parseInt(res.headers.get('content-range')?.split('/')[1]) : 0;
                        return isNaN(count) ? 0 : count;
                    }).catch(() => 0),
                    supabaseFetch('notices?select=id&limit=0', { method: 'HEAD' }).then(res => {
                        const count = res ? parseInt(res.headers.get('content-range')?.split('/')[1]) : 0;
                        return isNaN(count) ? 0 : count;
                    }).catch(() => 0),
                ]);

                log(`Data: ${students} students, ${teachers} teachers, ${classes} classes, ${notices} notices`);

                mainContent.innerHTML = `
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
                        <div class="bg-brand-900 rounded-2xl p-6 border border-white/5 text-center">
                            <span class="material-symbols-outlined text-3xl text-accent-400">people</span>
                            <h3 class="text-3xl font-bold mt-3">${students}</h3>
                            <p class="text-sm text-gray-400">Students</p>
                        </div>
                        <div class="bg-brand-900 rounded-2xl p-6 border border-white/5 text-center">
                            <span class="material-symbols-outlined text-3xl text-accent-400">school</span>
                            <h3 class="text-3xl font-bold mt-3">${teachers}</h3>
                            <p class="text-sm text-gray-400">Teachers</p>
                        </div>
                        <div class="bg-brand-900 rounded-2xl p-6 border border-white/5 text-center">
                            <span class="material-symbols-outlined text-3xl text-accent-400">groups</span>
                            <h3 class="text-3xl font-bold mt-3">${classes}</h3>
                            <p class="text-sm text-gray-400">Classes</p>
                        </div>
                        <div class="bg-brand-900 rounded-2xl p-6 border border-white/5 text-center">
                            <span class="material-symbols-outlined text-3xl text-accent-400">campaign</span>
                            <h3 class="text-3xl font-bold mt-3">${notices}</h3>
                            <p class="text-sm text-gray-400">Notices</p>
                        </div>
                    </div>
                    <div class="bg-brand-900 rounded-2xl p-6 border border-white/5">
                        <h2 class="text-xl font-semibold mb-4">Recent Notices</h2>
                        <div id="recent-notices" class="space-y-3">Loading...</div>
                    </div>
                `;

                const noticesData = await supabaseFetch('notices?select=*&order=created_at.desc&limit=5');
                const container = document.getElementById('recent-notices');
                if (noticesData && noticesData.length > 0) {
                    container.innerHTML = noticesData.map(n => `
                        <div class="p-4 bg-white/[0.03] rounded-xl border border-white/5">
                            <h4 class="font-medium">${n.title}</h4>
                            <p class="text-sm text-gray-400 mt-1">${n.content}</p>
                            <span class="text-xs text-gray-500 mt-2 block">${new Date(n.created_at).toLocaleDateString()}</span>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p class="text-sm text-gray-400 py-4">No notices yet.</p>';
                }
            } catch (e) {
                showError('Failed to load dashboard. ' + e.message);
            }
        }

        // --- Students Module ---
        async function renderStudents() {
            try {
                const students = await supabaseFetch('students?select=*,classes(name)');
                const classes = await supabaseFetch('classes?select=*');

                mainContent.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4">
                        <h2 class="text-xl font-semibold">All Students</h2>
                        <button onclick="openStudentModal()" class="inline-flex items-center gap-2 px-4 py-2.5 bg-accent-500 hover:bg-accent-600 rounded-lg text-sm font-medium transition">
                            <span class="material-symbols-outlined text-lg">add</span> Add Student
                        </button>
                    </div>
                    <div class="bg-brand-900 rounded-2xl border border-white/5 overflow-x-auto">
                        <table class="w-full min-w-[700px]">
                            <thead>
                                <tr class="border-b border-white/5">
                                    <th class="px-6 py-4 text-left text-xs font-medium text-gray-400 uppercase">Name</th>
                                    <th class="px-6 py-4 text-left text-xs font-medium text-gray-400 uppercase">Class</th>
                                    <th class="px-6 py-4 text-left text-xs font-medium text-gray-400 uppercase">Parent Phone</th>
                                    <th class="px-6 py-4 text-left text-xs font-medium text-gray-400 uppercase">Admission Date</th>
                                    <th class="px-6 py-4 text-left text-xs font-medium text-gray-400 uppercase">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-white/5">
                                ${students.map(s => `
                                    <tr class="hover:bg-white/[0.02]">
                                        <td class="px-6 py-4 whitespace-nowrap">
                                            <div class="flex items-center gap-3">
                                                <div class="w-8 h-8 rounded-full bg-accent-500/20 flex items-center justify-center text-accent-400 text-xs font-semibold">${s.first_name.charAt(0)}${s.last_name.charAt(0)}</div>
                                                <span class="font-medium">${s.first_name} ${s.last_name}</span>
                                            </div>
                                        </td>
                                        <td class="px-6 py-4 text-sm text-gray-300">${s.classes?.name || 'N/A'}</td>
                                        <td class="px-6 py-4 text-sm text-gray-300">${s.parent_phone || 'N/A'}</td>
                                        <td class="px-6 py-4 text-sm text-gray-300">${new Date(s.admission_date).toLocaleDateString()}</td>
                                        <td class="px-6 py-4">
                                            <button onclick="editStudent('${s.id}')" class="text-accent-400 hover:text-accent-300 text-sm font-medium mr-3">Edit</button>
                                            <button onclick="deleteStudent('${s.id}')" class="text-red-400 hover:text-red-300 text-sm font-medium">Delete</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                    <!-- Student Modal -->
                    <div id="student-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
                        <div class="bg-brand-900 border border-white/10 rounded-2xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl">
                            <div class="flex items-center justify-between mb-6">
                                <h3 id="student-modal-title" class="text-xl font-semibold">Add Student</h3>
                                <button onclick="closeStudentModal()" class="p-1 hover:bg-white/5 rounded-lg text-gray-400">
                                    <span class="material-symbols-outlined">close</span>
                                </button>
                            </div>
                            <form id="student-form" class="space-y-5">
                                <input type="hidden" id="student-id">
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-300 mb-1">First Name</label>
                                        <input type="text" id="first-name" required class="w-full px-3.5 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-accent-500 outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-300 mb-1">Last Name</label>
                                        <input type="text" id="last-name" required class="w-full px-3.5 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-accent-500 outline-none">
                                    </div>
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-300 mb-1">Date of Birth</label>
                                        <input type="date" id="dob" class="w-full px-3.5 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-accent-500 outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-300 mb-1">Gender</label>
                                        <select id="gender" class="w-full px-3.5 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-accent-500 outline-none">
                                            <option value="">Select</option>
                                            <option value="male">Male</option>
                                            <option value="female">Female</option>
                                        </select>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-1">Class</label>
                                    <select id="class-id" required class="w-full px-3.5 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-accent-500 outline-none">
                                        ${classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-1">Parent Name</label>
                                    <input type="text" id="parent-name" class="w-full px-3.5 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-accent-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-1">Parent Phone</label>
                                    <input type="text" id="parent-phone" class="w-full px-3.5 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-accent-500 outline-none">
                                </div>
                                <div class="flex justify-end gap-3 pt-2">
                                    <button type="button" onclick="closeStudentModal()" class="px-5 py-2.5 border border-white/10 rounded-xl text-sm font-medium hover:bg-white/5 transition">Cancel</button>
                                    <button type="submit" class="px-5 py-2.5 bg-accent-500 hover:bg-accent-600 rounded-xl text-sm font-medium transition">Save</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            } catch (e) {
                showError('Failed to load students. ' + e.message);
            }
        }

        // Global student modal functions
        window.openStudentModal = async function(studentId = null) {
            const modal = document.getElementById('student-modal');
            const title = document.getElementById('student-modal-title');
            const form = document.getElementById('student-form');
            if (studentId) {
                title.textContent = 'Edit Student';
                const student = await supabaseFetch(`students?id=eq.${studentId}&limit=1`).then(d => d[0]);
                if (student) {
                    document.getElementById('student-id').value = student.id;
                    document.getElementById('first-name').value = student.first_name;
                    document.getElementById('last-name').value = student.last_name;
                    document.getElementById('dob').value = student.date_of_birth || '';
                    document.getElementById('gender').value = student.gender || '';
                    document.getElementById('class-id').value = student.class_id || '';
                    document.getElementById('parent-name').value = student.parent_name || '';
                    document.getElementById('parent-phone').value = student.parent_phone || '';
                }
            } else {
                title.textContent = 'Add Student';
                form.reset();
                document.getElementById('student-id').value = '';
            }
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeStudentModal = function() {
            document.getElementById('student-modal').classList.add('hidden');
            document.getElementById('student-modal').classList.remove('flex');
        };

        document.addEventListener('submit', async (e) => {
            if (e.target.id === 'student-form') {
                e.preventDefault();
                const id = document.getElementById('student-id').value;
                const studentData = {
                    first_name: document.getElementById('first-name').value,
                    last_name: document.getElementById('last-name').value,
                    date_of_birth: document.getElementById('dob').value || null,
                    gender: document.getElementById('gender').value,
                    class_id: document.getElementById('class-id').value,
                    parent_name: document.getElementById('parent-name').value,
                    parent_phone: document.getElementById('parent-phone').value,
                };

                try {
                    if (id) {
                        await supabaseFetch(`students?id=eq.${id}`, {
                            method: 'PATCH',
                            body: JSON.stringify(studentData)
                        });
                    } else {
                        await supabaseFetch('students', {
                            method: 'POST',
                            body: JSON.stringify(studentData)
                        });
                    }
                    closeStudentModal();
                    loadModule('students');
                } catch (err) {
                    alert('Error saving student: ' + err.message);
                }
            }
        });

        window.editStudent = (id) => openStudentModal(id);

        window.deleteStudent = async (id) => {
            if (confirm('Are you sure?')) {
                try {
                    await supabaseFetch(`students?id=eq.${id}`, { method: 'DELETE' });
                    loadModule('students');
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            }
        };

        // Sidebar links
        document.querySelectorAll('.sidebar-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                loadModule(link.dataset.module);
            });
        });

        // Mobile menu
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        document.getElementById('menu-toggle').addEventListener('click', () => {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        });
        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        }
        overlay.addEventListener('click', closeSidebar);

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('supabase_token');
            window.location.href = 'login.html';
        });

        // Start
        checkAuth();
    </script>
</body>
</html>
