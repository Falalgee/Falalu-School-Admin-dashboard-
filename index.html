<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Falalu Schools</title>
    <style>
        body {
            background: #060e1a;
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }
        #status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #000;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 6px 10px;
            z-index: 999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        a { color: #93c5fd; }
        .container { padding: 2rem; min-height: 100vh; }
        .loading { text-align: center; padding-top: 20vh; }
    </style>
</head>
<body>
    <div id="status-bar">⏳ Initializing...</div>
    <main id="main-content" class="container loading">
        <p>Loading dashboard…</p>
    </main>

    <script>
        const statusEl = document.getElementById('status-bar');
        function log(msg) {
            statusEl.textContent = msg;
            console.log(msg);
        }

        const SUPABASE_URL = 'https://hfdyznlnxfrrlqdziqpn.supabase.co';
        const ANON_KEY = 'sb_publishable_Dh5sg8xSYwsWtgttyCe2Zw_L_le2Yxk';

        // Get token and userId from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const userId = urlParams.get('userId');

        if (!token || !userId) {
            log('❌ Missing token or userId');
            document.getElementById('main-content').innerHTML = '<p style="color:red">No login token found. Please <a href="login.html">log in</a>.</p>';
            throw new Error('Missing parameters');
        }

        log('✅ Token found. Fetching profile…');

        // Fetch profile using plain fetch (same as login)
        async function fetchProfile() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${userId}&select=*`, {
                    headers: {
                        'apikey': ANON_KEY,
                        'Authorization': `Bearer ${token}`,
                    },
                });

                if (!res.ok) {
                    const errText = await res.text();
                    log('❌ Profile fetch error: ' + errText);
                    document.getElementById('main-content').innerHTML = `<p style="color:red">Error loading profile: ${errText}</p>`;
                    return;
                }

                const profiles = await res.json();
                const profile = profiles[0];

                if (!profile) {
                    log('❌ Profile not found for user ' + userId);
                    document.getElementById('main-content').innerHTML = `<p style="color:red">Profile not found.</p><p>Your user ID: ${userId}</p><p>Run the SQL to add your profile with role 'admin'.</p>`;
                    return;
                }

                const name = profile.full_name || 'User';
                log(`✅ Welcome, ${name} (${profile.role})`);
                document.getElementById('main-content').innerHTML = `<h2>Dashboard</h2><p>Welcome, <strong>${name}</strong>!</p><p>Your role: ${profile.role}</p><p>The dashboard is ready. Modules will be added now.</p>`;
            } catch (err) {
                log('❌ Unexpected error: ' + err.message);
                document.getElementById('main-content').innerHTML = `<p style="color:red">Unexpected error: ${err.message}</p>`;
            }
        }

        fetchProfile();
    </script>
</body>
</html>
