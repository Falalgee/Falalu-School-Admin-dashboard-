<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Falalu Schools</title>
    <style>
        body {
            background: #060e1a;
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }
        #status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #000;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 6px 10px;
            z-index: 999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        a { color: #93c5fd; }
        .container { padding: 2rem; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="status-bar">⏳ Initializing...</div>
    <main id="main-content" class="container">
        <p>Loading dashboard…</p>
    </main>

    <script>
        const statusEl = document.getElementById('status-bar');
        function log(msg) {
            statusEl.textContent = msg;
            console.log(msg);
        }

        const SUPABASE_URL = 'https://hfdyznlnxfrrlqdziqpn.supabase.co';
        const ANON_KEY = 'sb_publishable_Dh5sg8xSYwsWtgttyCe2Zw_L_le2Yxk';

        // Read token and userId from localStorage
        const token = localStorage.getItem('supabase_token');
        const userId = localStorage.getItem('supabase_user_id');

        if (!token || !userId) {
            log('❌ No saved session. Redirecting to login...');
            window.location.replace('login.html');
            throw new Error('No token');
        }

        log('✅ Token found. Checking validity...');

        // Quick check: decode token and see if expired
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            const now = Math.floor(Date.now() / 1000);
            if (payload.exp && payload.exp < now) {
                log('❌ Token expired. Redirecting to login...');
                localStorage.removeItem('supabase_token');
                localStorage.removeItem('supabase_user_id');
                window.location.replace('login.html');
                throw new Error('Token expired');
            }
        } catch (e) {
            log('❌ Invalid token format. Redirecting to login...');
            localStorage.removeItem('supabase_token');
            localStorage.removeItem('supabase_user_id');
            window.location.replace('login.html');
            throw new Error('Invalid token');
        }

        log('Token valid. Fetching profile...');

        // Fetch profile using fetch
        async function fetchProfile() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${userId}&select=*`, {
                    headers: {
                        'apikey': ANON_KEY,
                        'Authorization': `Bearer ${token}`,
                    },
                });

                if (!res.ok) {
                    const errText = await res.text();
                    log('❌ Profile fetch error: ' + errText);
                    document.getElementById('main-content').innerHTML = `<p style="color:red">Error loading profile: ${errText}</p>`;
                    return;
                }

                const profiles = await res.json();
                const profile = profiles[0];

                if (!profile) {
                    log('❌ Profile not found');
                    document.getElementById('main-content').innerHTML = `<p style="color:red">Profile not found for your account. Please contact the administrator.</p>`;
                    return;
                }

                const name = profile.full_name || 'User';
                log(`✅ Welcome, ${name} (${profile.role})`);
                document.getElementById('main-content').innerHTML = `
                    <div style="text-align:center">
                        <h2>Welcome, ${name}!</h2>
                        <p>Your role: ${profile.role}</p>
                        <p>Dashboard modules will appear here once we rebuild them.</p>
                        <p><a href="#" onclick="localStorage.clear(); window.location.replace('login.html')">Logout</a></p>
                    </div>`;
            } catch (err) {
                log('❌ Unexpected error: ' + err.message);
                document.getElementById('main-content').innerHTML = `<p style="color:red">Unexpected error: ${err.message}</p>`;
            }
        }

        fetchProfile();
    </script>
</body>
</html>
