<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Falalu Schools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 900: '#0a1628', 950: '#060e1a' },
                        accent: { 500: '#2563eb', 600: '#1d4ed8' }
                    },
                    fontFamily: {
                        display: ['"Playfair Display"', 'serif'],
                        body: ['"Inter"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
        body { background: #060e1a; color: #ffffff; font-family: 'Inter', sans-serif; }
        .sidebar-link {
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }
        .sidebar-link:hover { background: rgba(37,99,235,0.1); }
        .sidebar-link.active {
            background: linear-gradient(90deg, rgba(37,99,235,0.2) 0%, transparent 100%);
            border-left-color: #2563eb;
        }
        @media (max-width: 1023px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay { display: none; }
            .sidebar-overlay.show { display: block; }
        }
        #status-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #000; color: #0f0; font-family: monospace; font-size: 12px; padding: 6px 10px; z-index: 999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body class="bg-brand-950 text-white font-body antialiased">
    <div id="status-bar">⏳ Initializing...</div>
    <!-- Sidebar overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay fixed inset-0 bg-black/50 z-20" onclick="closeSidebar()"></div>
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar w-64 bg-brand-900 border-r border-white/5 flex flex-col fixed h-full z-30 inset-y-0 left-0 lg:relative lg:translate-x-0">
        <div class="h-20 flex items-center px-6 border-b border-white/5">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-lg bg-accent-500 flex items-center justify-center text-white"><span class="material-symbols-outlined text-xl">school</span></div>
                <div><h1 class="font-display text-lg font-bold">Falalu</h1><p class="text-xs text-gray-400" id="sidebar-role">Admin</p></div>
            </div>
        </div>
        <nav class="flex-1 py-6 px-3 space-y-1 overflow-y-auto" id="sidebar-nav"></nav>
        <div class="p-4 border-t border-white/5">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-accent-500/20 flex items-center justify-center text-accent-400 font-semibold text-sm" id="user-avatar">A</div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium truncate" id="user-name">Admin</p>
                    <button id="logout-btn" class="text-xs text-gray-400 hover:text-red-400 transition">Logout</button>
                </div>
            </div>
        </div>
    </aside>
    <!-- Main content -->
    <div class="flex-1 flex flex-col min-h-screen lg:ml-64">
        <header class="sticky top-0 z-10 bg-brand-900/95 backdrop-blur-sm border-b border-white/5">
            <div class="flex items-center justify-between h-16 px-4 lg:px-8">
                <div class="flex items-center gap-4">
                    <button id="menu-toggle" class="lg:hidden p-2 rounded-lg hover:bg-white/5 text-gray-400"><span class="material-symbols-outlined">menu</span></button>
                    <h1 class="font-display text-xl lg:text-2xl font-bold" id="module-title">Dashboard</h1>
                </div>
                <div class="flex items-center gap-3">
                    <div class="hidden sm:flex items-center gap-3 border-l border-white/5 pl-4"><span class="text-sm font-medium hidden lg:inline" id="header-user">Admin User</span></div>
                </div>
            </div>
        </header>
        <main id="main-content" class="flex-1 p-4 lg:p-8 flex items-center justify-center">
            <div class="text-center"><div class="animate-spin h-10 w-10 border-2 border-accent-500 border-t-transparent rounded-full mx-auto"></div><p class="mt-4 text-gray-400">Loading...</p></div>
        </main>
    </div>

    <script>
        const statusEl = document.getElementById('status-bar');
        function log(msg) { statusEl.textContent = msg; console.log(msg); }
        const SUPABASE_URL = 'https://hfdyznlnxfrrlqdziqpn.supabase.co';
        const ANON_KEY = 'sb_publishable_Dh5sg8xSYwsWtgttyCe2Zw_L_le2Yxk';
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const userId = urlParams.get('userId');
        if (!token || !userId) { log('No token'); window.location.replace('login.html'); }
        const authToken = token;
        const currentUserId = userId;
        let userRole = 'teacher';
        async function supabaseFetch(path, opts = {}) {
            const url = `${SUPABASE_URL}/rest/v1/${path}`;
            const headers = { 'apikey': ANON_KEY, 'Authorization': `Bearer ${authToken}`, ...opts.headers };
            if (!headers['Content-Type'] && opts.body) headers['Content-Type'] = 'application/json';
            const res = await fetch(url, { ...opts, headers });
            if (!res.ok) { let errMsg = `Error ${res.status}`; try { const e = await res.json(); errMsg = e.message || errMsg; } catch(e){} throw new Error(errMsg); }
            if (res.status === 204 || opts.method === 'HEAD') return null;
            const text = await res.text();
            return text ? JSON.parse(text) : null;
        }
        async function uploadImage(file) {
            if (!file) return null;
            const fileName = `student-${Date.now()}-${file.name.replace(/\s/g,'_')}`;
            const res = await fetch(`${SUPABASE_URL}/storage/v1/object/student-photos/${fileName}`, {
                method: 'POST',
                headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${authToken}`, 'x-upsert': 'true' },
                body: file
            });
            if (!res.ok) { const e = await res.json().catch(()=>({message:'Upload failed'})); throw new Error(e.message||e.error); }
            return `${SUPABASE_URL}/storage/v1/object/public/student-photos/${fileName}`;
        }
        function buildSidebar(role) {
            const nav = document.getElementById('sidebar-nav');
            let links = role === 'admin' ? `
                <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300" data-module="dashboard"><span class="material-symbols-outlined text-xl">dashboard</span> Dashboard</a>
                <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300" data-module="students"><span class="material-symbols-outlined text-xl">people</span> Students</a>
                <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300" data-module="teachers"><span class="material-symbols-outlined text-xl">school</span> Teachers</a>
                <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300" data-module="classes"><span class="material-symbols-outlined text-xl">groups</span> Classes</a>
                <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300" data-module="attendance"><span class="material-symbols-outlined text-xl">checklist</span> Attendance</a>
                <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300" data-module="exams"><span class="material-symbols-outlined text-xl">quiz</span> Exams</a>
                <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300" data-module="fees"><span class="material-symbols-outlined text-xl">payments</span> Fees</a>
                <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300" data-module="notices"><span class="material-symbols-outlined text-xl">campaign</span> Notices</a>
            ` : `
                <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300" data-module="my-students"><span class="material-symbols-outlined text-xl">people</span> My Students</a>
                <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300" data-module="teacher-attendance"><span class="material-symbols-outlined text-xl">checklist</span> Attendance</a>
                <a href="#" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300" data-module="teacher-exams"><span class="material-symbols-outlined text-xl">quiz</span> Exam Scores</a>
            `;
            nav.innerHTML = links;
            document.querySelectorAll('.sidebar-link').forEach(l => l.addEventListener('click', e => { e.preventDefault(); loadModule(l.dataset.module); }));
        }
        async function init() {
            log('Fetching profile...');
            try {
                const profiles = await supabaseFetch(`profiles?id=eq.${currentUserId}&select=*`);
                const profile = profiles[0];
                if (!profile) { document.getElementById('main-content').innerHTML = `<div class="text-center text-red-400 p-4"><p class="font-bold">Profile not found</p><p><a href="login.html" class="text-accent-400 underline">Back to login</a></p></div>`; return; }
                userRole = profile.role;
                const name = profile.full_name || (profile.teacher_id_number ? `Teacher ${profile.teacher_id_number}` : 'User');
                document.getElementById('user-name').textContent = name;
                document.getElementById('user-avatar').textContent = name.charAt(0).toUpperCase();
                document.getElementById('header-user').textContent = name;
                document.getElementById('sidebar-role').textContent = userRole === 'admin' ? 'Admin' : 'Teacher';
                buildSidebar(userRole);
                loadModule(userRole === 'admin' ? 'dashboard' : 'my-students');
            } catch(e) { log('Error: '+e.message); document.getElementById('main-content').innerHTML = `<div class="text-center text-red-400 p-4"><p class="font-bold">Error</p><p>${e.message}</p></div>`; }
        }
        const mainContent = document.getElementById('main-content');
        const moduleTitle = document.getElementById('module-title');
        function showError(msg) { log('ERROR: '+msg); mainContent.innerHTML = `<div class="text-center text-red-400 p-4"><p class="font-bold">${msg}</p></div>`; }
        async function loadModule(module) {
            log('Loading: '+module);
            const titles = {
                dashboard:'Dashboard Overview', students:'Students', teachers:'Teachers', classes:'Classes',
                attendance:'Attendance', exams:'Exams', fees:'Fees', notices:'Notices',
                'my-students':'My Students', 'teacher-attendance':'Attendance', 'teacher-exams':'Exam Scores'
            };
            moduleTitle.textContent = titles[module]||module;
            mainContent.innerHTML = `<div class="flex items-center justify-center h-64 text-gray-400">Loading...</div>`;
            try {
                switch(module) {
                    case 'dashboard': await renderDashboard(); break;
                    case 'students': await renderStudents(); break;
                    case 'teachers': await renderTeachers(); break;
                    case 'classes': await renderClasses(); break;
                    case 'my-students': await renderMyStudents(); break;
                    case 'teacher-attendance': await renderTeacherAttendance(); break;
                    case 'teacher-exams': await renderTeacherExams(); break;
                    default: mainContent.innerHTML = `<div class="flex items-center justify-center h-64 text-gray-400">Coming soon</div>`;
                }
            } catch(e) { showError('Failed: '+e.message); }
            document.querySelectorAll('.sidebar-link').forEach(l => { l.classList.remove('active'); if(l.dataset.module===module) l.classList.add('active'); });
            if(window.innerWidth<1024) closeSidebar();
        }

        // Dashboard
        async function renderDashboard() {
            const count = async (table) => { try{ const r = await supabaseFetch(`${table}?select=id`); return Array.isArray(r)?r.length:0; }catch(e){ return 0; } };
            const [stu, tea, cla, not] = await Promise.all([count('students'), count('teachers'), count('classes'), count('notices')]);
            mainContent.innerHTML = `
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
                    <div class="bg-brand-900 rounded-2xl p-6 border border-white/5 text-center"><span class="material-symbols-outlined text-3xl text-accent-400">people</span><h3 class="text-3xl font-bold mt-3">${stu}</h3><p class="text-sm text-gray-400">Students</p></div>
                    <div class="bg-brand-900 rounded-2xl p-6 border border-white/5 text-center"><span class="material-symbols-outlined text-3xl text-accent-400">school</span><h3 class="text-3xl font-bold mt-3">${tea}</h3><p class="text-sm text-gray-400">Teachers</p></div>
                    <div class="bg-brand-900 rounded-2xl p-6 border border-white/5 text-center"><span class="material-symbols-outlined text-3xl text-accent-400">groups</span><h3 class="text-3xl font-bold mt-3">${cla}</h3><p class="text-sm text-gray-400">Classes</p></div>
                    <div class="bg-brand-900 rounded-2xl p-6 border border-white/5 text-center"><span class="material-symbols-outlined text-3xl text-accent-400">campaign</span><h3 class="text-3xl font-bold mt-3">${not}</h3><p class="text-sm text-gray-400">Notices</p></div>
                </div>
                <div class="bg-brand-900 rounded-2xl p-6 border border-white/5"><h2 class="text-xl font-semibold mb-4">Recent Notices</h2><div id="recent-notices" class="space-y-3">Loading...</div></div>
            `;
            const notices = await supabaseFetch('notices?select=*&order=created_at.desc&limit=5').catch(()=>[]);
            const cont = document.getElementById('recent-notices');
            cont.innerHTML = notices.length ? notices.map(n=>`<div class="p-4 bg-white/[0.03] rounded-xl border border-white/5"><h4 class="font-medium">${n.title}</h4><p class="text-sm text-gray-400 mt-1">${n.content}</p><span class="text-xs text-gray-500 mt-2 block">${new Date(n.created_at).toLocaleDateString()}</span></div>`).join('') : '<p class="text-sm text-gray-400 py-4">No notices.</p>';
        }

        // Students (admin) - includes image upload, edit, delete
        async function renderStudents() {
            const students = await supabaseFetch('students?select=*,classes(name)');
            const classes = await supabaseFetch('classes?select=*');
            mainContent.innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4"><h2 class="text-xl font-semibold">All Students</h2><button onclick="openStudentModal()" class="inline-flex items-center gap-2 px-4 py-2.5 bg-accent-500 hover:bg-accent-600 rounded-lg text-sm font-medium transition"><span class="material-symbols-outlined text-lg">add</span> Add Student</button></div>
                <div class="bg-brand-900 rounded-2xl border border-white/5 overflow-x-auto"><table class="w-full min-w-[700px]"><thead><tr class="border-b border-white/5"><th class="px-6 py-4 text-left text-xs font-medium text-gray-400 uppercase">Photo</th><th class="px-6 py-4 text-left text-xs font-medium text-gray-400 uppercase">Name</th><th class="px-6 py-4 text-left text-xs font-medium text-gray-400 uppercase">Class</th><th class="px-6 py-4 text-left text-xs font-medium text-gray-400 uppercase">Parent Phone</th><th class="px-6 py-4 text-left text-xs font-medium text-gray-400 uppercase">Admission Date</th><th class="px-6 py-4 text-left text-xs font-medium text-gray-400 uppercase">Actions</th></tr></thead><tbody class="divide-y divide-white/5">
                ${students.map(s => `<tr class="hover:bg-white/[0.02]"><td class="px-6 py-4"><img src="${s.photo_url||''}" alt="${s.first_name}" class="w-8 h-8 rounded-full object-cover bg-white/10" onerror="this.style.display='none'"></td><td class="px-6 py-4 whitespace-nowrap font-medium">${s.first_name} ${s.last_name}</td><td class="px-6 py-4 text-sm text-gray-300">${s.classes?.name||'N/A'}</td><td class="px-6 py-4 text-sm text-gray-300">${s.parent_phone||'N/A'}</td><td class="px-6 py-4 text-sm text-gray-300">${new Date(s.admission_date).toLocaleDateString()}</td><td class="px-6 py-4"><button onclick="editStudent('${s.id}')" class="text-accent-400 hover:text-accent-300 text-sm font-medium mr-3">Edit</button><button onclick="deleteStudent('${s.id}')" class="text-red-400 hover:text-red-300 text-sm font-medium">Delete</button></td></tr>`).join('')}
                </tbody></table></div>
                <!-- Student Modal -->
                <div id="student-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4 backdrop-blur-sm"><div class="bg-brand-900 border border-white/10 rounded-2xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl"><div class="flex items-center justify-between mb-6"><h3 id="student-modal-title" class="text-xl font-semibold">Add Student</h3><button onclick="closeStudentModal()" class="p-1 hover:bg-white/5 rounded-lg text-gray-400"><span class="material-symbols-outlined">close</span></button></div><form id="student-form" class="space-y-5"><input type="hidden" id="student-id"><input type="hidden" id="existing-photo-url"><div class="grid grid-cols-1 sm:grid-cols-2 gap-5"><div><label class="block text-sm font-medium text-gray-300 mb-1">First Name</label><input type="text" id="first-name" required class="w-full px-3.5 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-accent-500 outline-none"></div><div><label class="block text-sm font-medium text-gray-300 mb-1">Last Name</label><input type="text" id="last-name" required class="w-full px-3.5 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-accent-500 outline-none"></div></div><div><label class="block text-sm font-medium text-gray-300 mb-1">Photo</label><input type="file" id="student-photo" accept="image/*" class="w-full text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-accent-500 file:text-white hover:file:bg-accent-600"><img id="image-preview" class="hidden" src="" alt="Preview"></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-5"><div><label class="block text-sm font-medium text-gray-300 mb-1">Date of Birth</label><input type="date" id="dob" class="w-full px-3.5 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-accent-500 outline-none"></div><div><label class="block text-sm font-medium text-gray-300 mb-1">Gender</label><select id="gender" class="w-full px-3.5 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-accent-500 outline-none"><option value="">Select</option><option value="male">Male</option><option value="female">Female</option></select></div></div><div><label class="block text-sm font-medium text-gray-300 mb-1">Class</label><select id="class-id" required class="w-full px-3.5 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-accent-500 outline-none">${classes.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><div><label class="block text-sm font-medium text-gray-300 mb-1">Parent Name</label><input type="text" id="parent-name" class="w-full px-3.5 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-accent-500 outline-none"></div><div><label class="block text-sm font-medium text-gray-300 mb-1">Parent Phone</label><input type="text" id="parent-phone" class="w-full px-3.5 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-accent-500 outline-none"></div><div class="flex justify-end gap-3 pt-2"><button type="button" onclick="closeStudentModal()" class="px-5 py-2.5 border border-white/10 rounded-xl text-sm font-medium hover:bg-white/5 transition">Cancel</button><button type="submit" class="px-5 py-2.5 bg-accent-500 hover:bg-accent-600 rounded-xl text-sm font-medium transition">Save</button></div></form></div></div>
            `;
            document.getElementById('student-photo').addEventListener('change', function(e) {
                const file = e.target.files[0], preview = document.getElementById('image-preview');
                if(file) { const reader = new FileReader(); reader.onload = e => { preview.src = e.target.result; preview.classList.remove('hidden'); }; reader.readAsDataURL(file); }
                else preview.classList.add('hidden');
            });
        }

        // Teachers (admin) – includes class assignment via teacher_classes, create new user, etc.
        async function renderTeachers() {
            const teachers = await supabaseFetch('teachers?select=*,profiles(full_name,email,teacher_id_number)');
            const allProfiles = await supabaseFetch('profiles?select=*');
            const teacherIds = teachers.map(t=>t.id);
            const availableProfiles = allProfiles.filter(p=>!teacherIds.includes(p.id));
            const allClasses = await supabaseFetch('classes?select=*');
            mainContent.innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4"><h2 class="text-xl font-semibold">All Teachers</h2><button onclick="openTeacherModal()" class="inline-flex items-center gap-2 px-4 py-2.5 bg-accent-500 hover:bg-accent-600 rounded-lg text-sm font-medium transition"><span class="material-symbols-outlined text-lg">add</span> Add Teacher</button></div>
                <div class="bg-brand-900 rounded-2xl border border-white/5 overflow-x-auto"><table class="w-full min-w-[800px]"><thead><tr class="border-b border-white/5"><th class="px-6 py-4 text-left text-xs font-medium text-gray-400 uppercase">ID</th><th class="px-6 py-4 text-left text-xs font-medium text-gray-400 uppercase">Name</th><th class="px-6 py-4 text-left text-xs font-medium text-gray-400 uppercase">Email</th><th class="px-6 py-4 text-left text-xs font-medium text-gray-400 uppercase">Qualification</th><th class="px-6 py-4 text-left text-xs font-medium text-gray-400 uppercase">Classes</th><th class="px-6 py-4 text-left text-xs font-medium text-gray-400 uppercase">Actions</th></tr></thead><tbody class="divide-y divide-white/5">
                ${teachers.map(t => `<tr class="hover:bg-white/[0.02]"><td class="px-6 py-4 text-sm text-gray-300">${t.profiles?.teacher_id_number||'N/A'}</td><td class="px-6 py-4 whitespace-nowrap font-medium">${t.profiles?.full_name||'N/A'}</td><td class="px-6 py-4 text-sm text-gray-300">${t.profiles?.email||'N/A'}</td><td class="px-6 py-4 text-sm text-gray-300">${t.qualification||'N/A'}</td><td class="px-6 py-4 text-sm text-gray-300" id="classes-${t.id}">Loading...</td><td class="px-6 py-4"><button onclick="editTeacher('${t.id}')" class="text-accent-400 hover:text-accent-300 text-sm font-medium mr-3">Edit</button><button onclick="deleteTeacher('${t.id}')" class="text-red-400 hover:text-red-300 text-sm font-medium">Delete</button></td></tr>`).join('')}
                </tbody></table></div>
                <!-- Teacher Modal -->

                const specialization = document.getElementById('teacher-specialization').value;

                try {
                    // If new teacher and profile selected, or creating new profile

                                method: 'POST',

                            });

                        await supabaseFetch(`teachers?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ qualification, subject_specialization: specialization }) });
                        // Update profile (ID and name)
                        await supabaseFetch(`profiles?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ teacher_id_number: teacherIdNumber, full_name: fullName }) });
                        // Update classes: delete existing, insert new
                        await supabaseFetch(`teacher_classes?teacher_id=eq.${id}`, { method: 'DELETE' });
                        for(const classId of selectedClasses) {
                            await supabaseFetch('teacher_classes', { method: 'POST', body: JSON.stringify({ teacher_id: id, class_id: classId }) });
                        }
                    }
                    closeTeacherModal(); loadModule('teachers');
                } catch(err) { alert('Error saving teacher: '+err.message); }
            }
        });

        // Mobile sidebar
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        document.getElementById('menu-toggle').addEventListener('click', () => { sidebar.classList.toggle('open'); overlay.classList.toggle('show'); });
        function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('show'); }
        overlay.addEventListener('click', closeSidebar);

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => window.location.replace('login.html'));

        init();
    </script>
</body>
</html>
