<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Falalu Schools</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #060e1a;
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }
        .login-card {
            background: #0a1628;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h1 { font-size: 24px; margin-bottom: 4px; }
        .login-card p { color: #aaa; margin-bottom: 24px; }
        label { display: block; text-align: left; font-size: 14px; color: #ccc; margin-bottom: 4px; }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: #1e293b;
            color: white;
            font-size: 16px;
            margin-bottom: 16px;
            outline: none;
        }
        input::placeholder { color: #9ca3af; }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .error {
            color: #f87171;
            font-size: 14px;
            margin-top: 16px;
            display: none;
            text-align: center;
            background: rgba(248,113,113,0.1);
            padding: 10px;
            border-radius: 8px;
        }
        .loading {
            display: none;
            margin-top: 16px;
            color: #aaa;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-card">
        <h1>Falalu Schools</h1>
        <p>Admin Portal</p>

        <form id="login-form">
            <label for="email">Email address</label>
            <input type="email" id="email" required placeholder="admin@school.com">

            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="Enter your password">

            <button type="submit">Sign In</button>
        </form>

        <div class="error" id="error-message"></div>
        <div class="loading" id="loading">Signing in…</div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://hfdyznlnxfrrlqdziqpn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Dh5sg8xSYwsWtgttyCe2Zw_L_le2Yxk';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-message');
        const loading = document.getElementById('loading');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            form.style.display = 'none';
            loading.style.display = 'block';
            errorMsg.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                // Show specific Supabase error message
                let displayMessage = error.message;
                if (error.message.includes('Email not confirmed')) {
                    displayMessage = 'Your email is not confirmed. Please check your inbox or disable email confirmation in Supabase settings.';
                } else if (error.message.includes('Invalid login credentials')) {
                    displayMessage = 'Invalid email or password. Please try again.';
                }

                errorMsg.textContent = displayMessage;
                errorMsg.style.display = 'block';
                loading.style.display = 'none';
                form.style.display = 'block';
            } else {
                // Successful login
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
