<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Falalu Schools</title>
    <style>
        body {
            background: #060e1a;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #0a1628;
            padding: 2rem;
            border-radius: 1rem;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #333;
            border-radius: 0.5rem;
            background: #1e293b;
            color: white;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #2563eb;
            border: none;
            border-radius: 0.5rem;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .msg {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            display: none;
        }
        .msg.error { background: rgba(255,0,0,0.2); color: #ff6666; }
        .msg.success { background: rgba(0,255,0,0.2); color: #66ff66; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Falalu Schools</h2>
        <p>Admin / Teacher Login</p>
        <form id="login-form">
            <input type="text" id="email-or-id" placeholder="Email or Teacher ID" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <div id="message" class="msg"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hfdyznlnxfrrlqdziqpn.supabase.co';
        const ANON_KEY = 'sb_publishable_Dh5sg8xSYwsWtgttyCe2Zw_L_le2Yxk';

        const form = document.getElementById('login-form');
        const msgDiv = document.getElementById('message');

        function showMessage(text, isError = true) {
            msgDiv.textContent = text;
            msgDiv.className = 'msg ' + (isError ? 'error' : 'success');
            msgDiv.style.display = 'block';
        }

        showMessage('Enter your email or teacher ID.', false);

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('email-or-id').value.trim();
            const password = document.getElementById('password').value;
            let email = input;

            // If input is not an email, treat it as teacher ID
            if (!input.includes('@')) {
                showMessage('Looking up ID...', false);
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?select=email&teacher_id_number=eq.${encodeURIComponent(input)}`, {
                        headers: { 'apikey': ANON_KEY }
                    });
                    const profiles = await res.json();
                    if (profiles.length === 0) {
                        showMessage('Teacher ID not found.', true);
                        return;
                    }
                    email = profiles[0].email;
                } catch (err) {
                    showMessage('Error looking up ID: ' + err.message, true);
                    return;
                }
            }

            showMessage('Signing in...', false);
            try {
                const authRes = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': ANON_KEY,
                    },
                    body: JSON.stringify({ email, password }),
                });

                const authData = await authRes.json();

                if (!authRes.ok || !authData.access_token) {
                    const errorMsg = authData.error_description || authData.msg || 'Invalid credentials';
                    showMessage('Login failed: ' + errorMsg, true);
                    return;
                }

                // Save token and user ID to localStorage
                const token = authData.access_token;
                const payload = JSON.parse(atob(token.split('.')[1]));
                const userId = payload.sub;

                localStorage.setItem('supabase_token', token);
                localStorage.setItem('supabase_user_id', userId);

                showMessage('Login successful! Redirecting...', false);
                window.location.replace('index.html');
            } catch (err) {
                showMessage('Network error: ' + err.message, true);
            }
        });
    </script>
</body>
</html>
