<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Falalu Schools</title>
    <style>
        body {
            background: #060e1a;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #0a1628;
            padding: 2rem;
            border-radius: 1rem;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #333;
            border-radius: 0.5rem;
            background: #1e293b;
            color: white;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #2563eb;
            border: none;
            border-radius: 0.5rem;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .msg {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            display: none;
        }
        .msg.error { background: rgba(255,0,0,0.2); color: #ff6666; }
        .msg.success { background: rgba(0,255,0,0.2); color: #66ff66; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Falalu Schools</h2>
        <p>Admin Login</p>
        <form id="login-form">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <div id="message" class="msg"></div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://hfdyznlnxfrrlqdziqpn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Dh5sg8xSYwsWtgttyCe2Zw_L_le2Yxk';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('login-form');
        const msgDiv = document.getElementById('message');

        function showMessage(text, isError = true) {
            msgDiv.textContent = text;
            msgDiv.className = 'msg ' + (isError ? 'error' : 'success');
            msgDiv.style.display = 'block';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            showMessage('Trying to log in...', false);

            const { data, error } = await supabase.auth.signInWithPassword({
                email,
                password,
            });

            if (error) {
                showMessage('Login failed: ' + error.message, true);
            } else if (data && data.user) {
                showMessage('Login successful! Redirecting...', false);
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                showMessage('Login failed: unexpected response', true);
            }
        });
    </script>
</body>
</html>
